name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy through Pages REST API
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            let artifact;
            for (let attempt = 0; attempt < 10; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...repo, run_id: context.runId });
              artifact = data.artifacts.find(item => item.name === 'github-pages' && !item.expired);
              if (artifact) break;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            if (!artifact) throw new Error('Uploaded Pages artifact is unavailable');
            const oidcToken = await core.getIDToken();
            core.setSecret(oidcToken);
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo,
              artifact_id: artifact.id,
              pages_build_version: context.sha,
              oidc_token: oidcToken
            });
            core.setOutput('page_url', deployment.page_url);
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...repo, deployment_id: deployment.id
              });
              if (data.status === 'succeed') {
                core.info('Portfolio deployed successfully.');
                return;
              }
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'failed', 'cancelled'].includes(data.status)) {
                throw new Error('Pages deployment failed: ' + data.status);
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('Pages deployment did not finish within three minutes');
